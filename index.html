<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attack on Titan · Khan Family</title>
  <style>
    /* ultra minimal, smooth, simple */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f6;   /* soft off-white, very calm */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.4;
      color: #1e1e1e;
    }

    /* main card – keeps everything together with soft shadow */
    .card {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      padding: 2.5rem 1.8rem 2.8rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.03), 0 4px 12px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* huge ATTACK ON TITAN text – clean, bold, no fuss */
    .huge-title {
      font-size: clamp(3.2rem, 16vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #0b0b0b;
      margin-bottom: 0.5rem;
      word-break: break-word;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* very short khan family texts – small, subtle, smooth spacing */
    .khan-note {
      margin: 1rem 0 1.8rem;
      font-size: 1.2rem;
      font-weight: 400;
      color: #3c3c3c;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem 1.6rem;
      letter-spacing: 0.2px;
    }

    .khan-note span {
      background: #f2f2f2;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.95rem;
      color: #2a2a2a;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .khan-note span:hover {
      background: #e8e8e8;
    }

    /* iframe container – no extra decoration, just clean frame */
    .video-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 0.5rem 0 0.2rem;
      border-radius: 20px;
      overflow: hidden;
      transition: opacity 0.2s;
    }

    /* keep iframe responsive without breaking layout */
    .video-wrapper iframe {
      max-width: 100%;
      width: 100%;
      height: auto;
      aspect-ratio: 560 / 365;  /* maintain original proportions */
      border: none;
      overflow: hidden;
      display: block;
    }

    /* small extra touch – subtle footer-like line, but very short */
    .simple-foot {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #b0b0b0;
      letter-spacing: 0.3px;
      font-weight: 400;
      text-transform: lowercase;
    }

    /* fine adjustments for small screens */
    @media (max-width: 500px) {
      .card {
        padding: 2rem 1.2rem 2.2rem;
        border-radius: 28px;
      }

      .khan-note {
        font-size: 1rem;
        gap: 0.5rem 1rem;
      }

      .khan-note span {
        font-size: 0.85rem;
        padding: 0.3rem 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- huge text – exactly as requested -->
    <h1 class="huge-title">Attack On Titan</h1>

    <!-- very short texts for khan family -->
    <div class="khan-note">
      <span>khan family</span>
      <span>always</span>
      <span>together</span>
      <span>strong</span>
    </div>

    <!-- facebook reel embed – fullscreen already enabled via allowfullscreen -->
    <div class="video-wrapper">
      <iframe 
        src="https://www.facebook.com/plugins/video.php?height=250&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1639478437151515%2F&show_text=true&width=560&t=0" 
        width="560" 
        height="365" 
        style="border:none;overflow:hidden" 
        scrolling="no" 
        frameborder="0" 
        allowfullscreen="true" 
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" 
        allowFullScreen="true">
      </iframe>
    </div>

    <!-- tiny extra, still ultra simple -->
    <div class="simple-foot">for khan family</div>
  </div>
</body>
</html>
